name: filimu_plus
description: "Tamba IPTV - Open-source IPTV media player"
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Routing & Deep Linking
  go_router: ^14.2.0

  # Local Persistence & Database
  drift: ^2.18.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Media Playback (libmpv universal hardware-accelerated engine)
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # XMLTV & Compression
  xml: ^6.5.0
  archive: ^3.6.1

  # Security & Credentials
  crypto: ^3.0.3

  # Remote Control Embedded Server
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # File Picker & Utilities
  file_picker: ^8.0.3
  uuid: ^4.4.0
  intl: ^0.19.0

  # UI & Design System
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

dependency_overrides:
  volume_controller:
    path: packages/volume_controller

flutter:
  uses-material-design: true
