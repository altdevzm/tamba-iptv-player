name: Flutter builds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --no-pub

  android:
    name: Build Android
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Build Android App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Name Android builds
        run: |
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          mkdir -p build/release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "build/release-assets/Tamba-IPTV-Android-${VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/release-assets/Tamba-IPTV-Android-${VERSION}.aab"

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-and-tv
          path: build/release-assets/*
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          $version = (Select-String '^version:\s*(\S+)' pubspec.yaml).Matches.Groups[1].Value.Split('+')[0]
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler "/DAppVersion=$version" 'packaging/windows/tamba-iptv.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installers/Tamba-IPTV-Windows-*-Setup.exe
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --no-pub

      - name: Create macOS disk image
        run: |
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          STAGING_DIR="$RUNNER_TEMP/tamba-iptv-dmg"
          mkdir -p "$STAGING_DIR" build/release-assets
          cp -R build/macos/Build/Products/Release/filimu_plus.app "$STAGING_DIR/Tamba IPTV.app"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create \
            -volname "Tamba IPTV" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDZO \
            "build/release-assets/Tamba-IPTV-macOS-${VERSION}.dmg"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/release-assets/*.dmg
          if-no-files-found: error

  linux:
    name: Build Linux packages
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libmpv-dev mpv \
            ruby ruby-dev build-essential rpm zstd libarchive-tools

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --no-pub

      - name: Build Linux packages
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          STAGING="$RUNNER_TEMP/tamba-iptv-package-root"
          PACKAGE_DIR="$GITHUB_WORKSPACE/build/release-assets"
          mkdir -p "$STAGING/opt" "$STAGING/usr/bin" "$STAGING/usr/share/applications" "$PACKAGE_DIR"
          cp -a "$BUNDLE" "$STAGING/opt/tamba-iptv"
          cat > "$STAGING/usr/bin/tamba-iptv" <<'EOF'
          #!/bin/sh
          exec /opt/tamba-iptv/filimu_plus "$@"
          EOF
          chmod 755 "$STAGING/usr/bin/tamba-iptv"
          cat > "$STAGING/usr/share/applications/tamba-iptv.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Tamba IPTV
          Comment=IPTV media player
          Exec=tamba-iptv
          Icon=multimedia-player
          Terminal=false
          Categories=AudioVideo;Player;TV;
          EOF
          sudo gem install --no-document fpm

          fpm -s dir -t deb \
            --name tamba-iptv --version "$VERSION" --architecture amd64 \
            --package "$PACKAGE_DIR/Tamba-IPTV-Linux-${VERSION}-amd64.deb" \
            --description "Tamba IPTV media player" \
            --depends 'libgtk-3-0 | libgtk-3-0t64' \
            --depends 'libmpv2' --depends 'libsecret-1-0' \
            -C "$STAGING" .

          fpm -s dir -t rpm \
            --name tamba-iptv --version "$VERSION" --architecture x86_64 \
            --package "$PACKAGE_DIR/Tamba-IPTV-Linux-${VERSION}-x86_64.rpm" \
            --description "Tamba IPTV media player" \
            --depends gtk3 --depends mpv-libs --depends libsecret \
            -C "$STAGING" .

          fpm -s dir -t pacman \
            --name tamba-iptv --version "$VERSION" --architecture x86_64 \
            --package "$PACKAGE_DIR/Tamba-IPTV-Linux-${VERSION}-x86_64.pkg.tar.zst" \
            --description "Tamba IPTV media player" \
            --depends gtk3 --depends mpv --depends libsecret \
            -C "$STAGING" .

          tar -C "$GITHUB_WORKSPACE/build/linux/x64/release" \
            -czf "$PACKAGE_DIR/Tamba-IPTV-Linux-${VERSION}-x64.tar.gz" bundle

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-rpm-arch-portable
          path: build/release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          find release-assets -type f -print0 |
            xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
